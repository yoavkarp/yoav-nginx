events {}
http {
    # HTTP → HTTPS
    server {
        listen 80;
        server_name playms.net;

        return 301 https://$host$request_uri;
    }
    
    server {
        listen 443 ssl;
        server_name playms.net;
        
        ssl_certificate     /etc/letsencrypt/live/playms.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/playms.net/privkey.pem;
        
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        resolver 127.0.0.11 valid=10s;

        location /api {
            set $backend_upstream http://backend:5000;
            
            proxy_pass $backend_upstream;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 10h;
        }

        location / {
            set $frontend_upstream http://frontend:3000;
            
            proxy_pass $frontend_upstream;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
        }
    }
}
